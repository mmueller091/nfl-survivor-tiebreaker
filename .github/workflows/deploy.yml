name: Deploy NFL pool
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfl-survivor-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      NFL_WORKER_NAME: ${{ vars.NFL_WORKER_NAME }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/prepare-worker.mjs
      - run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
      - name: Install runtime secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          COMMISSIONER_KEY: ${{ secrets.COMMISSIONER_KEY }}
        run: |
          test -n "$SESSION_SECRET"
          test -n "$COMMISSIONER_KEY"
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config dist/server/wrangler.json
          printf '%s' "$COMMISSIONER_KEY" | npx wrangler secret put COMMISSIONER_KEY --config dist/server/wrangler.json
      - run: npx wrangler deploy --config dist/server/wrangler.json
